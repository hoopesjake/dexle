<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexle — Create Account</title><link rel="stylesheet" href="stats.css"><link rel="stylesheet" href="account.css"><link rel="stylesheet" href="trainer-menu.css?v=20260805-1"></head><body data-auth-page="signup"><div class="wrap auth-page"><header><a class="lamp home-lamp" href="index.html" aria-label="Dexle home"></a><div class="titles"><h1>Create Account</h1><p class="tag">Build your Trainer identity.</p></div></header><a class="auth-page-back" href="account.html">&larr; Trainer Account</a><section class="panel focused-auth-card signup-card"><p class="eyebrow">New Trainer</p><h2>Create your account</h2><p class="section-copy">Your existing runs on this device will stay with you.</p><div id="authPageMessage" class="account-message" hidden></div><form id="focusedAuthForm" class="auth-form"><label>Username<input id="focusedUsername" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocomplete="username" required placeholder="Trainer name"></label><label>Email<input id="focusedEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="focusedPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="At least 6 characters"></label><fieldset class="avatar-picker"><legend>Profile Pokémon <small>(optional)</small></legend><div class="avatar-search-row"><input id="focusedAvatarSearch" autocomplete="off" placeholder="Search any Pokémon or form"><label class="shiny-switch"><input id="focusedAvatarShiny" type="checkbox"> Shiny</label></div><div id="focusedAvatarResults" class="avatar-results"></div><div id="focusedAvatarChoice" class="avatar-choice"><span class="avatar-placeholder"></span><span>No sprite selected</span></div></fieldset><button id="focusedSubmit" type="submit">Create Account</button></form><p class="auth-page-switch">Already have an account? <a href="login.html">Sign in</a></p></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="stats-store.js?v=20260805-2"></script><script src="auth-page.js?v=20260805-1"></script><script src="trainer-menu.js?v=20260805-1"></script></body></html>
